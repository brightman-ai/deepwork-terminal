name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout terminal source
        uses: actions/checkout@v4
        with:
          path: deepwork-terminal

      # The terminal's @ce aliases resolve to a sibling checkout. Pin the source
      # revision used by the current frontend contract so CI is reproducible.
      - name: Checkout shared CE frontend source
        uses: actions/checkout@v4
        with:
          repository: brightman-ai/deepwork
          ref: 658ee60b49489852f488e491edd0a84f9b0c906e
          path: deepwork

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        working-directory: deepwork-terminal/frontend
        run: bun install --frozen-lockfile

      # ── Cross-repo module resolution map (keep the three mechanisms intact) ──
      # The pinned @ce tree is compiled from THIS toolchain, and each resolver
      # finds modules differently:
      #   vue-tsc            → frontend/tsconfig.json paths (pinned to this install)
      #   rollup (vite)      → frontend/vite.config.ts aliases (same physical copies)
      #   @vue/compiler-sfc  → real-filesystem walk-up from the importing file
      # The link below serves the third: it gives the CE tree a node_modules
      # view of THIS install — one version source, no second install. The
      # relative target needs BOTH ../.. levels (frontend → deepwork → root);
      # a one-level link dangles and compiler-sfc fails on Linux CI.
      # (Same concern, same semantics as build.sh's own CE-shell link step.)
      - name: Link the toolchain into the pinned CE source
        run: ln -s ../../deepwork-terminal/frontend/node_modules deepwork/frontend/node_modules

      - name: Test frontend
        working-directory: deepwork-terminal/frontend
        run: bun run test

      - name: Type-check frontend
        working-directory: deepwork-terminal/frontend
        run: bun run type-check

      - name: Build frontend
        working-directory: deepwork-terminal/frontend
        run: bun run build

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        run: ./build.sh --skip-frontend

      # The executable half of the shared-frontend contract (scripts/check-shared-frontend-deps.mjs).
      # It is here rather than only in deepwork-pro's build because two of the three halves are
      # about THIS repo: an import with no declared package, and — the one that has bitten twice —
      # an API endpoint the frontend calls that this server never routes. Both fail silently at
      # runtime, so a machine has to be the one that notices. Node only; nothing to install.
      - name: Shared frontend contract
        run: node scripts/check-shared-frontend-deps.mjs
