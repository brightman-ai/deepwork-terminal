name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout terminal source
        uses: actions/checkout@v4
        with:
          path: deepwork-terminal

      # The terminal's @ce aliases resolve to a sibling checkout. Pin the source
      # revision used by the current frontend contract so CI is reproducible.
      - name: Checkout shared CE frontend source
        uses: actions/checkout@v4
        with:
          repository: brightman-ai/deepwork
          ref: 038833a55593ad80f8e9ad738fe6da0260aafd1b
          path: deepwork

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        working-directory: deepwork-terminal/frontend
        run: bun install --frozen-lockfile

      # The pinned @ce tree is compiled from THIS toolchain, but rollup and
      # @vue/compiler-sfc (defineProps type resolution) resolve imports by
      # walking up from the importing file, which never reaches our
      # node_modules from ../../deepwork. tsc is exempt: frontend/tsconfig.json
      # paths pin the CE tree's bare imports explicitly.
      - name: Link the toolchain into the pinned CE source
        run: ln -s ../deepwork-terminal/frontend/node_modules deepwork/frontend/node_modules

      - name: Test frontend
        working-directory: deepwork-terminal/frontend
        run: bun run test

      - name: Type-check frontend
        working-directory: deepwork-terminal/frontend
        run: bun run type-check

      - name: Build frontend
        working-directory: deepwork-terminal/frontend
        run: bun run build

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        run: ./build.sh --skip-frontend

      # The executable half of the shared-frontend contract (scripts/check-shared-frontend-deps.mjs).
      # It is here rather than only in deepwork-pro's build because two of the three halves are
      # about THIS repo: an import with no declared package, and — the one that has bitten twice —
      # an API endpoint the frontend calls that this server never routes. Both fail silently at
      # runtime, so a machine has to be the one that notices. Node only; nothing to install.
      - name: Shared frontend contract
        run: node scripts/check-shared-frontend-deps.mjs
