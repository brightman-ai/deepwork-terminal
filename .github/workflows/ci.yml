name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout terminal source
        uses: actions/checkout@v4
        with:
          path: deepwork-terminal

      # The terminal's @ce aliases resolve to a sibling checkout. Pin the source
      # revision used by the current frontend contract so CI is reproducible.
      - name: Checkout shared CE frontend source
        uses: actions/checkout@v4
        with:
          repository: brightman-ai/deepwork
          ref: c57cb4925301545d32a6e30ae36b43545d969d98
          path: deepwork

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        working-directory: deepwork-terminal/frontend
        run: bun install --frozen-lockfile

      # The pinned @ce tree is compiled from THIS toolchain, but resolvers
      # disagree on where modules come from: vue-tsc uses frontend/tsconfig.json
      # paths (pinned to this install), rollup uses the vite aliases below —
      # and @vue/compiler-sfc (defineProps type resolution) walks the real
      # filesystem from the importing file, which only works when the CE tree
      # has its own node_modules. Install it for real; runtime imports are
      # still aliased onto this repo's physical copies, so the bundle keeps a
      # single vue context regardless of what versions land here.
      - name: Install the pinned CE source's dependencies
        working-directory: deepwork/frontend
        run: bun install

      - name: Test frontend
        working-directory: deepwork-terminal/frontend
        run: bun run test

      - name: Type-check frontend
        working-directory: deepwork-terminal/frontend
        run: bun run type-check

      - name: Build frontend
        working-directory: deepwork-terminal/frontend
        run: bun run build

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binary
        run: ./build.sh --skip-frontend

      # The executable half of the shared-frontend contract (scripts/check-shared-frontend-deps.mjs).
      # It is here rather than only in deepwork-pro's build because two of the three halves are
      # about THIS repo: an import with no declared package, and — the one that has bitten twice —
      # an API endpoint the frontend calls that this server never routes. Both fail silently at
      # runtime, so a machine has to be the one that notices. Node only; nothing to install.
      - name: Shared frontend contract
        run: node scripts/check-shared-frontend-deps.mjs
